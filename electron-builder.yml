appId: com.bookreader.app
productName: BookReader
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  # 托盘图标运行时按路径读取，必须随包带上
  - build/**/*
  # OCR 模型与字典：运行时按路径读取
  - resources/**/*
  # 下面这批包在主进程产物里是 external（见 vite.config.ts 的 rollupOptions.external），
  # 运行时靠 require 从 node_modules 取，不打进包里就会一启动就 Cannot find module。
  # ⚠️ 两边必须同步：改了那边的 external，这里就要跟着加。
  - node_modules/pdfjs-dist/**/*
  - node_modules/epubjs/**/*
  - node_modules/mammoth/**/*
  - node_modules/marked/**/*
  - node_modules/katex/**/*
  - node_modules/jszip/**/*
  - node_modules/pdf-lib/**/*
  - node_modules/cheerio/**/*
  # cheerio/slim 走子路径导出，依赖的解析器不在 cheerio 包内，要一起带上
  - node_modules/htmlparser2/**/*
  - node_modules/domhandler/**/*
  - node_modules/domutils/**/*
  - node_modules/dom-serializer/**/*
  - node_modules/domelementtype/**/*
  - node_modules/entities/**/*
  - node_modules/css-select/**/*
  - node_modules/css-what/**/*
  - node_modules/boolbase/**/*
  - node_modules/nth-check/**/*
  - node_modules/parse5/**/*
  - node_modules/parse5-htmlparser2-tree-adapter/**/*
  - node_modules/parse5-parser-stream/**/*
  - node_modules/encoding-sniffer/**/*
  - node_modules/whatwg-mimetype/**/*
  - node_modules/undici/**/*
  # 各包的运行时传递依赖（没有打进 bundle，必须随包分发）
  - node_modules/tslib/**/*
  - node_modules/lie/**/*
  - node_modules/immediate/**/*
  - node_modules/setimmediate/**/*
  - node_modules/pako/**/*
  - node_modules/readable-stream/**/*
  - node_modules/string_decoder/**/*
  - node_modules/safe-buffer/**/*
  - node_modules/inherits/**/*
  - node_modules/base64-js/**/*
  - node_modules/ieee754/**/*
  - node_modules/fast-xml-parser/**/*
  - node_modules/strnum/**/*
  - node_modules/commander/**/*
  - node_modules/iconv-lite/**/*
  - node_modules/safer-buffer/**/*
  - node_modules/xml-name-validator/**/*
  # 下面是校验脚本（.tmp-verify/check-packlist.cjs）跑出来的闭包补漏：
  # 手工凭印象列白名单一定漏，漏一个就是打包版启动即崩，所以补完必须重跑脚本
  - node_modules/@pdf-lib/**/*
  - node_modules/@xmldom/**/*
  - node_modules/argparse/**/*
  - node_modules/bluebird/**/*
  - node_modules/cheerio-select/**/*
  - node_modules/dingbat-to-unicode/**/*
  - node_modules/duck/**/*
  - node_modules/lop/**/*
  - node_modules/option/**/*
  - node_modules/path-is-absolute/**/*
  - node_modules/sql.js/**/*
  - node_modules/underscore/**/*
  - node_modules/util-deprecate/**/*
  - node_modules/whatwg-encoding/**/*
  - node_modules/xmlbuilder/**/*
  - node_modules/node-llama-cpp/**/*
  - node_modules/@node-llama-cpp/**/*
  # 只保留 CPU 版二进制（win-x64，46MB）。CUDA / Vulkan / arm64 变体合计 627MB，
  # 而本应用自己的模型组件下载链路取的就是 CPU 版（见 model-registry 的
  # LLAMA_CPU_ZIP_URL），本地推理不依赖它们。
  # 代价：有 N 卡的机器失去依赖顺带带来的 GPU 加速，退回 CPU 推理。
  # 要恢复 GPU 加速，删掉下面四行重新打包即可。
  - "!node_modules/@node-llama-cpp/win-x64-cuda/**"
  - "!node_modules/@node-llama-cpp/win-x64-cuda-ext/**"
  - "!node_modules/@node-llama-cpp/win-x64-vulkan/**"
  - "!node_modules/@node-llama-cpp/win-arm64/**"
# 原生 .node 不能跑在 asar 包内，必须解包
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch:
        - x64
    # 绿色单文件版：便携模式，数据目录随 exe 走（见 electron/main.ts 的 PORTABLE_EXECUTABLE_DIR）
    - target: portable
      arch:
        - x64
    # MSI：企业内分发与静默安装用（msiexec /i xxx.msi /qn）
    - target: msi
      arch:
        - x64
  icon: build/icon.ico
  # 关闭「签名并改写可执行文件」。
  # 原因：electron-builder 会解压 winCodeSign 工具包，包内含 macOS 的 .dylib 符号链接，
  # 而 Windows 默认账户没有创建符号链接的特权（需要管理员或开启「开发人员模式」），
  # 解压失败会让整次打包中断。本项目没有代码签名证书，签名本来就会被跳过；
  # 图标与版本信息仍由 win-unpacked 阶段写入（已核对 exe 内的图标资源与版本块）。
  # 若将来要正式签名，请开启开发人员模式或改用管理员权限构建，并去掉这一行。
  signAndEditExecutable: false
# 文件关联：与 electron/main.ts 的 ASSOCIATED_EXTS 保持一致，改了要两边同步
fileAssociations:
  - ext: epub
    name: EPUB 电子书
    description: EPUB 电子书
  - ext: txt
    name: 文本文档
    description: 文本文档
  - ext: md
    name: Markdown 文档
    description: Markdown 文档
  - ext: pdf
    name: PDF 文档
    description: PDF 文档
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
compression: maximum
asar: true
